<html>
    <head>
        <title>ColorFanilyGenerator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1 class="title luckiest-guy-regular">Welcome</h1>
        <p class="subTitle luckiest-guy-small">Lets pick the right color for your website</p>
        <div class="spins">
            <div class="element"> </div>
            <div class="element"> </div>
        </div>


        <div class="container">
            <form class="color-form">
                <label for="colorInput" class="visually-hidden">Base color</label>
                <input type="color" id="colorInput" value="#ff0000">
                <label for="colorMode" class="visually-hidden">Color scheme mode</label>
                <select id="colorMode" class="luckiest-guy-small">
                    <option value="monochrome">Monochrome</option>
                    <option value="analogic">Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="triad">Triad</option>
                    <option value="quad">Quad</option>
                </select>
                <button id="generateButton" class="luckiest-guy-small">Generate Color Scheme</button>
            </form>
            <div id="colorScheme" class="color-scheme">                                                                
            </div>
        </div>
        <script src="index.js"></script>

    </body>



</html>
